# Linux-xlnx 2022.2 prerequisites; out-of-tree HDMI modules have no TXSS Kconfig.
CONFIG_OF=y
CONFIG_I2C=y
CONFIG_I2C_XILINX=y
CONFIG_I2C_CHARDEV=y
CONFIG_COMMON_CLK=y
CONFIG_COMMON_CLK_IDT8T49N24X=y
CONFIG_GENERIC_PHY=y
CONFIG_DRM=y
CONFIG_DRM_XLNX=y
# PL_DISP is only useful with a real supported DMA source/CRTC.
# This design's custom AXIS source needs its own DRM CRTC or a Linux port.
